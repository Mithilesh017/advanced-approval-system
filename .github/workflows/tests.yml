name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aams
          POSTGRES_PASSWORD: aams
          POSTGRES_DB: aams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aams -d aams_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Runs every database test on SQLite and on this throwaway PostgreSQL service.
      TEST_DATABASE_URL: postgresql://aams:aams@localhost:5432/aams_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
