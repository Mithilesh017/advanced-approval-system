<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Admin Portal - AI Approval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- DataTables & ChartJS Requirements -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function AdminPortal() {
      const [view, setView] = useState('dashboard');
      const [allRequests, setAllRequests] = useState([]);
      const [user, setUser] = useState(JSON.parse(localStorage.getItem('ams_user')) || {email: 'admin@gmail.com'});

      const loadData = async () => {
        try {
          const res = await fetch('/api/auth/all_requests', { credentials: 'include' });
          if (res.ok) {
            const data = await res.json();
            
            const myRequests = data.map(r => ({
              id: r.id,
              reqId: `REQ_${r.id.toString().padStart(4, '0')}`,
              date: new Date(r.created_at).toISOString().split('T')[0],
              amount: r.amount,
              status: r.final_decision.startsWith('ESCALATED') ? 'Pending' : (r.final_decision === 'APPROVED' ? 'Approved' : 'Rejected'),
              category: r.request_type,
              role: r.role,
              department: r.department,
              destination: r.destination,
              currency: r.currency,
              email: r.submitted_by,
              raw_status: r.final_decision,
              aiScore: (r.xgb_score * 100).toFixed(1) + '%'
            }));
            setAllRequests(myRequests);
          }
        } catch (e) {
          console.error("Failed to load requests", e);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const pendingCount = allRequests.filter(r => r.status === 'Pending').length;
      const approvedCount = allRequests.filter(r => r.status === 'Approved').length;
      const rejectedCount = allRequests.filter(r => r.status === 'Rejected').length;

      const handleLogout = () => {
        Swal.fire({
          title: 'Confirm Logout',
          text: "Are you sure you want to log out?",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: 'var(--navy-primary)',
          cancelButtonColor: '#6c757d',
          confirmButtonText: 'Yes, log me out'
        }).then((result) => {
          if (result.isConfirmed) {
            localStorage.removeItem('ams_user');
            window.location.href = 'index.html';
          }
        });
      };

      return (
        <div className="app-container">
          <div className="sidebar">
            <div className="sidebar-header">
              <div className="brand-mark brand-mark-sm" aria-hidden="true"><i className="fas fa-shield-halved"></i></div>
              <span className="brand-name">ADVANCED APPROVAL MANAGEMENT SYSTEM</span>
            </div>
            
            <div className="sidebar-user">
              <div className="avatar-circle">
                {user.email.charAt(0).toUpperCase()}
              </div>
              <div className="sidebar-user-meta">
                <div className="email" title={user.email}>{user.email}</div>
                <span className={`badge ${user.role === 'SuperAdmin' ? 'badge-purple' : 'badge-accent'}`}>{user.role === 'SuperAdmin' ? 'Super Admin' : 'Admin'}</span>
              </div>
            </div>

            <div className="nav-label">Navigation</div>
            <ul className="nav-menu">
              <li>
                <button className={view === 'dashboard' ? 'active' : ''} onClick={() => setView('dashboard')}>
                  <i className="fas fa-chart-line"></i> Dashboard
                </button>
              </li>
              <li>
                <button className={view === 'pending' ? 'active' : ''} onClick={() => setView('pending')}>
                  <i className="fas fa-clock"></i> Pending 
                  <span className="count warning">{pendingCount}</span>
                </button>
              </li>
              <li>
                <button className={view === 'approved' ? 'active' : ''} onClick={() => setView('approved')}>
                  <i className="fas fa-check-circle"></i> Approved 
                  <span className="count success">{approvedCount}</span>
                </button>
              </li>
              <li>
                <button className={view === 'rejected' ? 'active' : ''} onClick={() => setView('rejected')}>
                  <i className="fas fa-times-circle"></i> Disapproved 
                  <span className="count secondary">{rejectedCount}</span>
                </button>
              </li>
              {user.role === 'SuperAdmin' && (
                <li>
                  <button className={view === 'mlops' ? 'active' : ''} onClick={() => setView('mlops')}>
                    <i className="fas fa-brain"></i> ML Agent
                  </button>
                </li>
              )}
              <li>
                <button className={view === 'users' ? 'active' : ''} onClick={() => setView('users')}><i className="fas fa-users-cog"></i> Manage Users</button>
              </li>
              <li>
                <button onClick={() => Swal.fire('About', 'Approval Management System Version 2.0', 'info')}><i className="fas fa-info-circle"></i> About App</button>
              </li>
              <li>
                <button className={view === 'profile' ? 'active' : ''} onClick={() => setView('profile')}>
                  <i className="fas fa-user-circle"></i> Profile
                </button>
              </li>
            </ul>
          </div>
          
          <div className="main-content">
            <div className="top-header">
              <h2>
                {view === 'dashboard' && <><i className="fas fa-chart-line"></i> Dashboard</>}
                {view === 'pending' && <><i className="fas fa-clock"></i> Pending Requests</>}
                {view === 'approved' && <><i className="fas fa-check-circle"></i> Approved Requests</>}
                {view === 'rejected' && <><i className="fas fa-times-circle"></i> Disapproved Requests</>}
                {view === 'mlops' && <><i className="fas fa-brain"></i> ML Agent Console</>}
                {view === 'users' && <><i className="fas fa-users-cog"></i> Manage Users</>}
                {view === 'profile' && <><i className="fas fa-user-circle"></i> My Profile</>}
              </h2>
              <div className="user-welcome">Welcome, {user.email}</div>
            </div>

            {view === 'dashboard' && <DashboardView 
                requests={allRequests} 
                userEmail={user.email.split('@')[0]} 
                setView={setView} 
                userRole={user.role}
            />}
            {(view === 'pending' || view === 'approved' || view === 'rejected') && 
                <TableView 
                    requests={allRequests} 
                    currentStatus={view === 'pending' ? 'Pending' : view === 'approved' ? 'Approved' : 'Rejected'} 
                    refresh={loadData} 
                />
            }
            {user.role === 'SuperAdmin' && view === 'mlops' && <MlopsView />}
            {view === 'users' && <UsersView userRole={user.role} />}
            {view === 'profile' && <ProfileView user={user} />}
          </div>
        </div>
      );
    }

    function DashboardView({ requests, userEmail, setView, userRole }) {
      const pieRef = useRef(null);
      const barRef = useRef(null);

      const pending = requests.filter(r => r.status === 'Pending').length;
      const approved = requests.filter(r => r.status === 'Approved').length;
      const rejected = requests.filter(r => r.status === 'Rejected').length;
      const total = requests.length;
      const approvalRate = total === 0 ? 0 : Math.round((approved / total) * 100);

      // Unique departments
      const departments = new Set(requests.map(r => r.department)).size;

      // Expense Types data for bar chart
      const expenseTypes = {};
      requests.forEach(r => {
          if (!expenseTypes[r.reqType]) {
              expenseTypes[r.reqType] = { approved: 0, pending: 0, rejected: 0 };
          }
          if (r.status === 'Approved') expenseTypes[r.reqType].approved++;
          if (r.status === 'Pending') expenseTypes[r.reqType].pending++;
          if (r.status === 'Rejected') expenseTypes[r.reqType].rejected++;
      });
      const barLabels = Object.keys(expenseTypes);
      const barApproved = barLabels.map(k => expenseTypes[k].approved);
      const barPending = barLabels.map(k => expenseTypes[k].pending);

      useEffect(() => {
        Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
        Chart.defaults.color = '#6e6e73';
        const legendStyle = { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, padding: 16 } };

        const ctxPie = pieRef.current.getContext('2d');
        const pieChart = new Chart(ctxPie, {
          type: 'doughnut',
          data: {
            labels: ['Approved', 'Pending', 'Disapproved'],
            datasets: [{ data: [approved, pending, rejected], backgroundColor: ['#34c759', '#ff9f0a', '#ff3b30'], borderWidth: 0, spacing: 2, borderRadius: 4 }]
          },
          options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { legend: legendStyle } }
        });

        const ctxBar = barRef.current.getContext('2d');
        const barChart = new Chart(ctxBar, {
          type: 'bar',
          data: {
            labels: barLabels.length > 0 ? barLabels : ['No Data'],
            datasets: [
              { label: 'Approved', data: barLabels.length > 0 ? barApproved : [0], backgroundColor: '#34c759', borderRadius: 6, borderSkipped: false, maxBarThickness: 26 },
              { label: 'Pending', data: barLabels.length > 0 ? barPending : [0], backgroundColor: '#ff9f0a', borderRadius: 6, borderSkipped: false, maxBarThickness: 26 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'y',
            scales: {
              x: { stacked: true, beginAtZero: true, grid: { color: 'rgba(60, 60, 67, 0.08)' }, border: { display: false }, ticks: { precision: 0 } },
              y: { stacked: true, grid: { display: false }, border: { display: false } }
            },
            plugins: { legend: legendStyle }
          }
        });

        return () => { pieChart.destroy(); barChart.destroy(); }
      }, [requests]);

      return (
        <div>
          <div className="dash-banner">
            <div className="dash-banner-left">
              <div className="dash-banner-icon"><i className="fas fa-user-circle"></i></div>
              <div>
                <h3>Welcome Admin!</h3>
                <p>You have admin access. Managing {total} total requests across {departments} departments.</p>
                <div className="dash-banner-tags">
                  <span><i className="fas fa-user-shield"></i> Administrator</span>
                  <span><i className="fas fa-clock"></i> Session: Active</span>
                </div>
              </div>
            </div>
            <div className="dash-banner-right">
              <h1>{approvalRate}%</h1>
              <span>APPROVAL RATE</span>
            </div>
          </div>

          <h4 className="section-title"><i className="fas fa-bolt"></i> Quick Actions</h4>
          <div className="quick-actions">
            <button type="button" className="qa-card qa-new" onClick={() => Swal.fire('Info', 'As an admin, you can view requests. Employees submit new requests from their portal.', 'info')}><i className="fas fa-plus-circle"></i> New Request</button>
            <button type="button" className="qa-card qa-pending" onClick={() => setView('pending')}><i className="fas fa-clock"></i> View Pending ({pending})</button>
            <button type="button" className="qa-card qa-approved" onClick={() => setView('approved')}><i className="fas fa-check-circle"></i> View Approved ({approved})</button>
            <button type="button" className="qa-card qa-users" onClick={() => setView('users')}><i className="fas fa-users-cog"></i> Manage Users</button>
          </div>

          <div className="stats-grid-4">
            <div className="stat-card blue">
              <div className="stat-icon"><i className="fas fa-folder-open"></i></div>
              <div className="stat-value">{total}</div>
              <div className="stat-label">Total Requests</div>
            </div>
            <div className="stat-card yellow">
              <div className="stat-icon"><i className="fas fa-clock"></i></div>
              <div className="stat-value">{pending}</div>
              <div className="stat-label">Pending</div>
            </div>
            <div className="stat-card green">
              <div className="stat-icon"><i className="fas fa-check-circle"></i></div>
              <div className="stat-value">{approved}</div>
              <div className="stat-label">Approved</div>
            </div>
            <div className="stat-card red">
              <div className="stat-icon"><i className="fas fa-times-circle"></i></div>
              <div className="stat-value">{rejected}</div>
              <div className="stat-label">Disapproved</div>
            </div>
          </div>

          <div className="stats-grid-3">
            <div className="stat-card blue">
              <div className="stat-icon"><i className="fas fa-users"></i></div>
              <div className="stat-value">2</div>
              <div className="stat-label">Total Users</div>
            </div>
            <div className="stat-card purple">
              <div className="stat-icon"><i className="fas fa-building"></i></div>
              <div className="stat-value">{departments}</div>
              <div className="stat-label">Departments</div>
            </div>
            <div className="stat-card teal">
              <div className="stat-icon"><i className="fas fa-percent"></i></div>
              <div className="stat-value">{approvalRate}%</div>
              <div className="stat-label">Approval Rate</div>
            </div>
          </div>

          <div className="progress-card">
            <div className="progress-icon"><i className="fas fa-chart-line"></i></div>
            <div className="progress-content">
              <div className="progress-header">
                <span>Overall Approval Rate</span>
                <span><i className="fas fa-check"></i> Approved: {approved} &nbsp; <i className="fas fa-clock"></i> Pending: {pending}</span>
              </div>
              <div className="progress-header"><h2>{approvalRate}%</h2></div>
              <div className="progress-track">
                <div className="progress-fill" style={{width: `${approvalRate}%`}}></div>
              </div>
            </div>
          </div>

          <div className="charts-grid">
            <div className="chart-card">
              <h4>Status Distribution</h4>
              <div className="chart-box"><canvas ref={pieRef}></canvas></div>
            </div>
            <div className="chart-card">
              <h4>Expense Types (Requests)</h4>
              <div className="chart-box"><canvas ref={barRef}></canvas></div>
            </div>
          </div>
        </div>
      );
    }

    function TableView({ requests, currentStatus, refresh }) {
      const tableRef = useRef(null);
      const filteredRequests = requests.filter(r => r.status === currentStatus);
      const tableKey = currentStatus + "_" + JSON.stringify(filteredRequests);

      useEffect(() => {
        if (!tableRef.current) return;
        
        const dt = $(tableRef.current).DataTable({
          dom: 'Bfrtip',
          buttons: [
            { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', className: 'btn btn-primary' },
            { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', className: 'btn btn-primary' },
            { extend: 'print', text: '<i class="fas fa-print"></i> Print', className: 'btn btn-primary' }
          ],
          pageLength: 10,
          order: [[0, 'desc']]
        });

        return () => {
           // Cleanup to prevent memory leaks when React unmounts this table
           dt.destroy();
        };
      }, [tableKey]); // Re-run only when the tableKey changes (full remount)

      const handleAction = async (id, newStatus) => {
        let endpoint = '';
        if (newStatus === 'Approved') endpoint = '/api/auth/approve_request';
        else if (newStatus === 'Rejected') endpoint = '/api/auth/reject_request';
        else return; // Moving back to pending not supported in this version

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id }),
            credentials: 'include'
          });
          if (res.ok) {
            refresh();
            Swal.fire({ icon: 'success', title: `Request ${newStatus}`, timer: 1500, showConfirmButton: false });
          }
        } catch (e) {
          Swal.fire({ icon: 'error', title: 'API Error', text: 'Failed to update request.' });
        }
      };

      const handleClearHistory = () => {
        Swal.fire({
          title: 'Are you sure?',
          text: "You won't be able to revert this!",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#d70015',
          cancelButtonColor: '#6c757d',
          confirmButtonText: 'Yes, clear all!'
        }).then((result) => {
          if (result.isConfirmed) {
            localStorage.removeItem('ams_requests');
            refresh();
            Swal.fire('Cleared!', 'All request history has been deleted.', 'success');
          }
        });
      };

      const getStatusBadge = (status) => {
        if(status === 'Pending') return <span className="status-badge status-pending">Pending</span>;
        if(status === 'Approved') return <span className="status-badge status-approved">Approved</span>;
        if(status === 'Rejected') return <span className="status-badge status-rejected">Disapproved</span>;
      };

      return (
        <div>
          <div className="stats-grid-3">
            <div className="stat-card yellow is-inline">
              <div className="stat-icon"><i className="fas fa-clock"></i></div>
              <div className="stat-body">
                <div className="stat-value">{requests.filter(r=>r.status==='Pending').length}</div>
                <div className="stat-label">Total Pending</div>
              </div>
            </div>
            <div className="stat-card green is-inline">
              <div className="stat-icon"><i className="fas fa-check-circle"></i></div>
              <div className="stat-body">
                <div className="stat-value">{requests.filter(r=>r.status==='Approved').length}</div>
                <div className="stat-label">Approved Requests</div>
              </div>
            </div>
            <div className="stat-card red is-inline">
              <div className="stat-icon"><i className="fas fa-times-circle"></i></div>
              <div className="stat-body">
                <div className="stat-value">{requests.filter(r=>r.status==='Rejected').length}</div>
                <div className="stat-label">Disapproved Requests</div>
              </div>
            </div>
          </div>
          <div className="table-card">
            <div className="filters-row">
              <div className="form-group">
                <label><i className="fas fa-building"></i> Department</label>
                <select><option>All Departments</option><option>Engineering</option><option>Sales</option><option>Marketing</option></select>
              </div>
              <div className="form-group">
                <label><i className="fas fa-tag"></i> Expense Type</label>
                <select><option>All Types</option><option>Hotel Booking</option><option>Flight Ticket</option></select>
              </div>
              <div className="form-group">
                <label><i className="fas fa-user"></i> Person Role</label>
                <input type="text" placeholder="Search by role..." />
              </div>
              <div>
                <button type="button" className="btn btn-tinted-danger" onClick={handleClearHistory}><i className="fas fa-trash"></i> Reset Database</button>
              </div>
            </div>

            <div key={tableKey} className="table-scroll">
              <table ref={tableRef} className="display">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Employee</th>
                    <th>Department</th>
                    <th>Job Role</th>
                    <th>Expense Type</th>
                    <th>Destination</th>
                    <th>Amount</th>
                    <th>AI Flag Reason</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredRequests.map(req => (
                    <tr key={req.id}>
                      <td><strong>{req.id}</strong></td>
                      <td>
                        <div className="cell-primary">{req.empName || req.email || 'Unknown'}</div>
                        <div className="cell-secondary">{req.empId || 'N/A'}</div>
                      </td>
                      <td>{req.department}</td>
                      <td>{req.role}</td>
                      <td>{req.reqType}</td>
                      <td>{req.destination}</td>
                      <td className="cell-nowrap">{req.amount} {req.currency}</td>
                      <td>
                        {req.confidence !== undefined && (
                          <span className={`badge badge-block ${req.confidence > 80 ? 'badge-green' : req.confidence < 20 ? 'badge-red' : 'badge-orange'}`}>
                            <i className="fas fa-brain"></i> Confidence: {req.confidence}%
                          </span>
                        )}
                        <span className="badge badge-block badge-accent">{req.reason || req.aiScore}</span>
                        {req.shap && (
                          <div className="shap-box">
                            <div className="shap-title">SHAP Impact</div>
                            {Object.entries(req.shap).map(([feature, impact]) => {
                              const isPositive = impact > 0;
                              return (
                                <div key={feature} className="shap-row">
                                  <span>{feature.replace('_', ' ')}:</span>
                                  <strong className={isPositive ? 'is-positive' : 'is-negative'}>
                                    {isPositive ? '+' : ''}{impact.toFixed(3)}
                                  </strong>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </td>
                      <td>{getStatusBadge(req.status)}</td>
                      <td className="cell-nowrap">
                        {req.status === 'Pending' ? (
                          <>
                            <button type="button" className="action-btn edit" onClick={() => handleAction(req.id, 'Approved')} title="Approve" aria-label="Approve"><i className="fas fa-check"></i></button>
                            <button type="button" className="action-btn delete" onClick={() => handleAction(req.id, 'Rejected')} title="Reject" aria-label="Reject"><i className="fas fa-xmark"></i></button>
                          </>
                        ) : (
                          <button type="button" className="action-btn info" onClick={() => handleAction(req.id, 'Pending')} title="Move to Pending" aria-label="Move to Pending"><i className="fas fa-undo"></i></button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function MlopsView() {
      const [training, setTraining] = useState(false);
      const [logs, setLogs] = useState([
        "[SYSTEM] Model loaded successfully.",
        "[SYSTEM] Awaiting retrain trigger..."
      ]);

      const [lastRetrainTime, setLastRetrainTime] = useState(
        parseInt(localStorage.getItem('ams_last_retrain')) || (Date.now() - 2 * 24 * 60 * 60 * 1000)
      );
      const [currentTime, setCurrentTime] = useState(Date.now());
      
      useEffect(() => {
        const interval = setInterval(() => {
          setCurrentTime(Date.now());
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const getElapsedTime = () => {
        const diff = Math.floor((currentTime - lastRetrainTime) / 1000);
        if (diff < 60) return diff + " seconds ago";
        if (diff < 3600) return Math.floor(diff / 60) + " minutes ago";
        if (diff < 86400) return Math.floor(diff / 3600) + " hours ago";
        return Math.floor(diff / 86400) + " days ago";
      };

      const triggerRetrain = () => {
        Swal.fire({
          title: 'Trigger Batch Retrain?',
          text: "This will feed recent overrides back into the ML pipeline.",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: 'var(--navy-primary)',
          cancelButtonColor: '#6c757d',
          confirmButtonText: 'Yes, Retrain Now!'
        }).then((result) => {
          if (result.isConfirmed) {
            setTraining(true);
            setLogs(prev => [...prev, "[JOB] Nightly Batch Retrain started..."]);
            setTimeout(() => {
              setLogs(prev => [...prev, "[JOB] Processing new manual overrides..."]);
            }, 1000);
            setTimeout(() => {
              setLogs(prev => [...prev, "[JOB] Updating gradient weights & vocabulary..."]);
            }, 2500);
            setTimeout(() => {
              setLogs(prev => [...prev, "[JOB] Success! Accuracy improved by 0.24%."]);
              setTraining(false);
              const now = Date.now();
              setLastRetrainTime(now);
              localStorage.setItem('ams_last_retrain', now);
              Swal.fire('Retrained!', 'The ML Model has been successfully updated.', 'success');
            }, 4000);
          }
        });
      };

      return (
        <div>
          <div className="dash-banner is-dark">
            <div className="dash-banner-left">
               <div className="dash-banner-icon"><i className="fas fa-robot"></i></div>
              <div>
                <h3>MLOps Control Center</h3>
                <p>Manage, retrain, and monitor the AI Approval Agent directly from this dashboard.</p>
              </div>
            </div>
          </div>
          
          <div className="stats-grid-3">
            <div className="stat-card blue">
              <div className="stat-icon"><i className="fas fa-microchip"></i></div>
              <div className="stat-value is-compact">Isolation Forest</div>
              <div className="stat-label">Active Model Architecture</div>
            </div>
            <div className="stat-card green">
              <div className="stat-icon"><i className="fas fa-bullseye"></i></div>
              <div className="stat-value">94.2%</div>
              <div className="stat-label">Current Accuracy Score</div>
            </div>
            <div className="stat-card purple">
              <div className="stat-icon"><i className="fas fa-history"></i></div>
              <div className="stat-value is-compact">{getElapsedTime()}</div>
              <div className="stat-label">Last Retrain Date</div>
            </div>
          </div>

          <div className="panel">
             <h3 className="panel-title"><i className="fas fa-cogs"></i> Retrain Pipeline</h3>
             <p className="panel-subtitle">
               Triggering this job will fetch all manual overrides (when an admin changed an AI decision) and retrain the model to learn from those corrections.
             </p>
             <button type="button" onClick={triggerRetrain} disabled={training} className="btn btn-primary btn-lg">
               {training ? <span><i className="fas fa-spinner fa-spin"></i> Retraining in progress...</span> : <span><i className="fas fa-bolt"></i> Trigger Nightly Batch Retrain</span>}
             </button>
             
             <div className="console" role="log" aria-live="polite">
               {logs.map((log, i) => <div key={i}>{log}</div>)}
             </div>
          </div>
        </div>
      );
    }

    function UsersView({ userRole }) {
      const [allUsers, setAllUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeRoleFilter, setActiveRoleFilter] = useState('All');

      const fetchUsers = async () => {
        try {
          const res = await fetch('/api/auth/users', { credentials: 'include' });
          const data = await res.json();
          if (Array.isArray(data)) {
            let filteredData = data;
            if (userRole === 'Admin') {
              filteredData = data.filter(u => u.role !== 'SuperAdmin');
            }
            setAllUsers(filteredData);
          } else {
            if (res.status === 401 || res.status === 403 || data.msg) {
               Swal.fire('Session Expired', 'Please log in again to manage users.', 'warning').then(() => { window.location.href = 'index.html'; });
            } else {
               Swal.fire('Error', data.error || data.msg || 'Could not fetch users from Auth API', 'error');
            }
            setAllUsers([]);
          }
        } catch (err) {
          console.error(err);
          Swal.fire('Error', 'Could not fetch users from Auth API', 'error');
          setAllUsers([]);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchUsers();
      }, []);

      const handleApprove = async (email) => {
        try {
          const res = await fetch('/api/auth/approve_user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email }),
            credentials: 'include'
          });
          const data = await res.json();
          if (res.ok) {
            Swal.fire('Approved!', data.message, 'success');
            fetchUsers(); // refresh list
          } else {
            Swal.fire('Error', data.error, 'error');
          }
        } catch(err) {
          console.error(err);
          Swal.fire('Error', 'Could not communicate with Auth API', 'error');
        }
      };

      const handleReject = async (email) => {
        try {
          const res = await fetch('/api/auth/reject_user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email }),
            credentials: 'include'
          });
          const data = await res.json();
          if (res.ok) {
            Swal.fire('Rejected!', data.message, 'success');
            fetchUsers(); // refresh list
          } else {
            Swal.fire('Error', data.error, 'error');
          }
        } catch(err) {
          console.error(err);
          Swal.fire('Error', 'Could not communicate with Auth API', 'error');
        }
      };

      const handleDelete = (email) => {
        Swal.fire({
          title: 'Are you sure?',
          text: `You are about to permanently delete ${email}. This action cannot be undone.`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Yes, delete entirely',
          confirmButtonColor: '#d70015'
        }).then(async (result) => {
          if (result.isConfirmed) {
            try {
              const res = await fetch('/api/auth/delete_user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email }),
                credentials: 'include'
              });
              const data = await res.json();
              if (res.ok) {
                Swal.fire('Deleted!', data.message, 'success');
                fetchUsers();
              } else {
                Swal.fire('Error', data.message, 'error');
              }
            } catch(err) {
              Swal.fire('Error', 'Could not communicate with Auth API', 'error');
            }
          }
        });
      };

      const pendingUsers = allUsers.filter(u => u.status === 'Pending');
      const activeUsers = allUsers.filter(u => u.status !== 'Pending' && (activeRoleFilter === 'All' || u.role === activeRoleFilter));

      return (
        <div className="panel">
          <h3 className="panel-title"><i className="fas fa-users-cog"></i> Manage Employee Requests</h3>
          <p className="panel-subtitle">Approve pending access requests for new standard User accounts. Once approved, they will be prompted to create a password.</p>
          
          {loading ? (
             <div className="loading-inline"><i className="fas fa-spinner fa-spin"></i> Loading employees...</div>
          ) : (
            <>
              {pendingUsers.length === 0 ? (
                 <div className="empty-state"><i className="fas fa-check-circle"></i>No pending employees found. Everything is up to date!</div>
              ) : (
                <div className="table-scroll">
                  <table className="data-table">
                    <thead>
                      <tr>
                        <th>Email Address</th>
                        <th>Requested Role</th>
                        <th>Request Date</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {pendingUsers.map(u => (
                        <tr key={u.id}>
                          <td>
                            <div className="cell-primary">{u.email}</div>
                            <div className="cell-secondary">{u.name ? `Name: ${u.name}` : ''}</div>
                          </td>
                          <td>
                            <span className={`badge ${u.role === 'Admin' ? 'badge-accent' : ''}`}>{u.role}</span>
                          </td>
                          <td className="cell-muted">
                            {new Date(u.created_at.replace(' ', 'T') + 'Z').toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: true, year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}
                          </td>
                          <td>
                            <div className="cell-actions">
                              <button type="button" onClick={() => handleApprove(u.email)} className="btn btn-primary btn-sm">
                                <i className="fas fa-check"></i> Approve
                              </button>
                              <button type="button" onClick={() => handleReject(u.email)} className="btn btn-tinted-danger btn-sm">
                                <i className="fas fa-times"></i> Reject
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              <hr className="divider" />
              
              <h3 className="panel-title"><i className="fas fa-users"></i> Current Active Employees</h3>
              <p className="panel-subtitle">Manage existing user accounts in the system. You can remove user access entirely.</p>
              
              <div className="segmented">
                <button type="button" className={`segment ${activeRoleFilter === 'All' ? 'is-active' : ''}`} onClick={() => setActiveRoleFilter('All')}>All</button>
                <button type="button" className={`segment ${activeRoleFilter === 'User' ? 'is-active' : ''}`} onClick={() => setActiveRoleFilter('User')}>Users</button>
                <button type="button" className={`segment ${activeRoleFilter === 'Admin' ? 'is-active' : ''}`} onClick={() => setActiveRoleFilter('Admin')}>Admins</button>
                {userRole === 'SuperAdmin' && (
                  <button type="button" className={`segment ${activeRoleFilter === 'SuperAdmin' ? 'is-active' : ''}`} onClick={() => setActiveRoleFilter('SuperAdmin')}>SuperAdmins</button>
                )}
              </div>
              
              {activeUsers.length === 0 ? (
                 <div className="empty-state is-neutral"><i className="fas fa-user-slash"></i>No active employees found.</div>
              ) : (
                <div className="table-scroll">
                  <table className="data-table">
                    <thead>
                      <tr>
                        <th>Email Address</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {activeUsers.map(u => (
                        <tr key={u.id}>
                          <td>
                            <div className="cell-primary">{u.email}</div>
                            <div className="cell-secondary">{u.name ? `Name: ${u.name}` : ''}</div>
                          </td>
                          <td>
                            <span className={`badge ${u.role === 'SuperAdmin' ? 'badge-purple' : u.role === 'Admin' ? 'badge-accent' : ''}`}>{u.role}</span>
                          </td>
                          <td>
                            <span className={`status-badge ${u.status === 'Active' ? 'status-approved' : u.status === 'Rejected' ? 'status-rejected' : 'status-pending'}`}>{u.status}</span>
                          </td>
                          <td>
                            {(userRole === 'SuperAdmin' || (userRole === 'Admin' && u.role === 'User')) && (
                              <button type="button" onClick={() => handleDelete(u.email)} className="btn btn-tinted-danger btn-sm">
                                <i className="fas fa-trash-alt"></i> Remove
                              </button>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function ProfileView({ user }) {
      const [loading, setLoading] = useState(false);
      const [profileData, setProfileData] = useState({ name: '', emp_id: '' });

      useEffect(() => {
        fetch(`/api/auth/get_profile?email=${user.email}`, { credentials: 'include' })
          .then(res => res.json())
          .then(data => {
            if(!data.error) {
              setProfileData({ name: data.name || '', emp_id: data.emp_id || '' });
            }
          });
      }, [user.email]);

      const handleChange = (e) => setProfileData({ ...profileData, [e.target.name]: e.target.value });

      const handleUpdate = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch('/api/auth/update_profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: user.email, name: profileData.name, emp_id: profileData.emp_id }),
            credentials: 'include'
          });
          const data = await res.json();
          if(res.ok) {
             Swal.fire('Updated!', data.message, 'success');
          } else {
             Swal.fire('Error', data.error, 'error');
          }
        } catch(err) {
          Swal.fire('Error', 'Connection failed', 'error');
        }
        setLoading(false);
      };

      const handleResetPassword = () => {
        Swal.fire({
          title: 'Reset Password',
          text: 'Are you sure want to Reset Your Password?',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Yes, reset it'
        }).then(async (result) => {
          if(result.isConfirmed) {
            Swal.fire({ title: 'Sending...', didOpen: () => { Swal.showLoading() } });
            try {
              const res = await fetch('/api/auth/request_password_reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email })
              });
              const data = await res.json();
              if (res.ok) {
                 Swal.fire('Notification Sent', 'A Notification Email is Sent to your Email to confirm, please check Your Inbox Or Spam Box', 'success')
                 .then(() => {
                    localStorage.removeItem('ams_user');
                    window.location.href = 'index.html';
                 });
              } else {
                 Swal.fire('Error', data.error, 'error');
              }
            } catch(e) {
               Swal.fire('Error', 'Network error', 'error');
            }
          }
        });
      };

      return (
        <div className="panel">
          <h3 className="panel-title"><i className="fas fa-user-circle"></i> User Profile</h3>

          <div className="profile-hero">
            <div className="avatar-circle">{user.email.charAt(0).toUpperCase()}</div>
            <div>
              <div className="profile-hero-name">{profileData.name || user.email.split('@')[0]}</div>
              <div className="profile-hero-sub">{user.email}</div>
            </div>
          </div>

          <form onSubmit={handleUpdate} className="profile-form">
            <div className="form-group">
              <label htmlFor="pf-email">Email Address (Read Only)</label>
              <input id="pf-email" type="email" value={user.email} disabled />
            </div>
            <div className="form-group">
              <label htmlFor="pf-name">Full Name / Username</label>
              <input id="pf-name" type="text" name="name" value={profileData.name} onChange={handleChange} placeholder="e.g., John Doe" />
            </div>
            <div className="form-group">
              <label htmlFor="pf-empid">Employee ID</label>
              <input id="pf-empid" type="text" name="emp_id" value={profileData.emp_id} onChange={handleChange} placeholder="e.g., EMP_1234" />
            </div>
            <button type="submit" className="btn btn-primary" disabled={loading}>
               {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-save"></i>} Update Profile
            </button>
          </form>

          <hr className="divider" />

          <h4 className="panel-title is-danger"><i className="fas fa-shield-alt"></i> Security</h4>
          <p className="panel-subtitle">Need to update your password? Request a secure password reset link to your email.</p>
          <div className="button-row">
            <button type="button" onClick={handleResetPassword} className="btn btn-tinted-danger">
              <i className="fas fa-key"></i> Reset Password
            </button>
            <button type="button" onClick={() => {
                Swal.fire({
                  title: 'Are you sure?',
                  text: 'You will be logged out of your session',
                  icon: 'warning',
                  showCancelButton: true,
                  confirmButtonText: 'Yes, logout'
                }).then((result) => {
                  if(result.isConfirmed) {
                    localStorage.removeItem('ams_user');
                    window.location.href = 'index.html';
                  }
                });
            }} className="btn btn-secondary">
              <i className="fas fa-sign-out-alt"></i> Logout
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminPortal />);
  </script>
</body>
</html>
