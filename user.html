<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Portal - AI Approval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25"></script>
  
  <!-- DataTables Requirements -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const signOut = () => {
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
        .catch(() => {})
        .finally(() => {
          localStorage.removeItem('ams_user');
          window.location.href = 'index.html';
        });
    };

    let sessionExpiredNotified = false;
    const isSessionExpired = (res) => {
      if (res.status !== 401 && res.status !== 422) return false;
      if (!sessionExpiredNotified) {
        sessionExpiredNotified = true;
        Swal.fire({ icon: 'warning', title: 'Session Expired', text: 'Please log in again to continue.', allowOutsideClick: false }).then(signOut);
      }
      return true;
    };

    function EmployeePortal() {
      const [view, setView] = useState('pending');
      const [user, setUser] = useState(JSON.parse(localStorage.getItem('ams_user')) || {email: 'user@gmail.com'});
      const [userRequests, setUserRequests] = useState([]);
      const [teamSize, setTeamSize] = useState(0);

      const loadData = async () => {
        try {
          const res = await fetch('/api/auth/my_requests', { credentials: 'include' });
          if (isSessionExpired(res)) return;
          if (res.ok) {
            const data = await res.json();
            
            // Map DB fields back to UI fields
            const myRequests = data.map(r => ({
              id: r.id,
              reqId: `REQ_${r.id.toString().padStart(4, '0')}`,
              date: new Date(r.created_at).toISOString().split('T')[0],
              amount: r.amount,
              status: r.final_decision.startsWith('ESCALATED') ? 'Pending' : (r.final_decision === 'APPROVED' ? 'Approved' : 'Rejected'),
              category: r.request_type,
              reqType: r.request_type,
              empName: r.employee_name,
              empId: r.employee_id,
              role: r.role,
              department: r.department,
              destination: r.destination,
              currency: r.currency,
              email: r.submitted_by,
              raw_status: r.final_decision,
              purpose: r.purpose,
              expenseDate: r.expense_date,
              endDate: r.end_date,
              receiptCount: r.receipt_count || 0
            }));
            setUserRequests(myRequests);
          }
        } catch (e) {
          console.error("Failed to load requests", e);
        }
      };

      useEffect(() => {
        loadData();
        fetch('/api/auth/get_profile', { credentials: 'include' })
          .then(res => (isSessionExpired(res) || !res.ok) ? null : res.json())
          .then(profile => { if (profile) setTeamSize(profile.report_count || 0); })
          .catch(() => {});
      }, []);

      const pendingCount = userRequests.filter(r => r.status === 'Pending').length;
      const approvedCount = userRequests.filter(r => r.status === 'Approved').length;
      const rejectedCount = userRequests.filter(r => r.status === 'Rejected').length;

      const handleLogout = () => {
        Swal.fire({
          title: 'Confirm Logout',
          text: "Are you sure you want to log out?",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: 'var(--navy-primary)',
          cancelButtonColor: '#6c757d',
          confirmButtonText: 'Yes, log me out'
        }).then((result) => {
          if (result.isConfirmed) {
            signOut();
          }
        });
      };

      return (
        <div className="app-container">
          <div className="sidebar">
            <div className="sidebar-header">
              <div className="brand-mark brand-mark-sm" aria-hidden="true"><i className="fas fa-shield-halved"></i></div>
              <span className="brand-name">ADVANCED APPROVAL MANAGEMENT SYSTEM</span>
            </div>
            <div className="sidebar-user">
              <div className="avatar-circle">
                {user.email.charAt(0).toUpperCase()}
              </div>
              <div className="sidebar-user-meta">
                <div className="email" title={user.email}>{user.email}</div>
                <span className="badge badge-green">Employee</span>
              </div>
            </div>
            <div className="nav-label">Navigation</div>
            <ul className="nav-menu">
              <li>
                <button className={view === 'pending' ? 'active' : ''} onClick={() => setView('pending')}>
                  <i className="fas fa-clock"></i> Pending
                  <span className="count warning">{pendingCount}</span>
                </button>
              </li>
              <li>
                <button className={view === 'approved' ? 'active' : ''} onClick={() => setView('approved')}>
                  <i className="fas fa-check-circle"></i> Approved
                  <span className="count success">{approvedCount}</span>
                </button>
              </li>
              <li>
                <button className={view === 'rejected' ? 'active' : ''} onClick={() => setView('rejected')}>
                  <i className="fas fa-times-circle"></i> Disapproved
                  <span className="count secondary">{rejectedCount}</span>
                </button>
              </li>
              {teamSize > 0 && (
                <li>
                  <button className={view === 'team' ? 'active' : ''} onClick={() => setView('team')}>
                    <i className="fas fa-user-tie"></i> Team Approvals
                  </button>
                </li>
              )}
              <li>
                <button className={view === 'profile' ? 'active' : ''} onClick={() => setView('profile')}>
                  <i className="fas fa-user-circle"></i> Profile
                </button>
              </li>
            </ul>
          </div>
          
          <div className="main-content">
            <div className="top-header">
              <h2>
                {view === 'pending' && <><i className="fas fa-clock"></i> Pending Requests</>}
                {view === 'approved' && <><i className="fas fa-check-circle"></i> Approved Requests</>}
                {view === 'rejected' && <><i className="fas fa-times-circle"></i> Disapproved Requests</>}
                {view === 'new' && <><i className="fas fa-plus-circle"></i> Submit Expense</>}
                {view === 'team' && <><i className="fas fa-user-tie"></i> Team Approvals</>}
                {view === 'profile' && <><i className="fas fa-user-circle"></i> My Profile</>}
              </h2>
              <div className="header-actions">
                 <div className="user-welcome">Welcome, {user.email}</div>
                 {view !== 'new' && (
                    <button type="button" className="btn btn-primary" onClick={() => setView('new')}>
                      <i className="fas fa-plus"></i> Add New
                    </button>
                 )}
              </div>
            </div>

            {view === 'new' ? (
              <NewRequestForm user={user} setView={setView} refresh={loadData} />
            ) : view === 'team' ? (
              <TeamApprovalsView user={user} />
            ) : view === 'profile' ? (
              <ProfileView user={user} />
            ) : (
              <UserTableView 
                requests={userRequests} 
                currentStatus={view === 'pending' ? 'Pending' : view === 'approved' ? 'Approved' : 'Rejected'} 
                pendingCount={pendingCount}
                approvedCount={approvedCount}
                rejectedCount={rejectedCount}
                refresh={loadData}
              />
            )}
          </div>
        </div>
      );
    }

    // Dates are plain YYYY-MM-DD values, so they are read as local dates to avoid shifting across time zones.
    const formatRequestDates = (start, end) => {
      const format = (value) => new Date(`${value}T00:00:00`).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      return end && end !== start ? `${format(start)} to ${format(end)}` : format(start);
    };

    const localToday = () => {
      const now = new Date();
      return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    };

    const RECEIPT_ACCEPT = '.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png';
    const RECEIPT_TYPES = ['application/pdf', 'image/jpeg', 'image/png'];
    const MAX_RECEIPTS = 5;

    // A quick check in the browser; the server checks each file's real content again.
    const checkReceiptFiles = (files) => {
      if (files.length > MAX_RECEIPTS) return `Attach at most ${MAX_RECEIPTS} receipts.`;
      if (files.some(file => file.size > 5 * 1024 * 1024)) return 'Each receipt must be 5 MB or smaller.';
      if (files.some(file => !RECEIPT_TYPES.includes(file.type))) return 'Receipts must be PDF, JPG or PNG files.';
      return null;
    };

    const fetchReceipts = async (requestId) => {
      try {
        const res = await fetch(`/api/auth/request_receipts?id=${encodeURIComponent(requestId)}`, { credentials: 'include' });
        if (isSessionExpired(res)) return null;
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'The receipts could not be loaded.');
        return data.receipts;
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Receipts Unavailable', text: err.message });
        return null;
      }
    };

    // Built from DOM nodes so file names are never treated as HTML.
    const receiptListElement = (receipts) => {
      const list = document.createElement('ul');
      list.className = 'receipt-list';
      receipts.forEach(receipt => {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = `/api/auth/receipt?id=${encodeURIComponent(receipt.id)}`;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = `${receipt.filename} (${Math.max(1, Math.round(receipt.size / 1024))} KB)`;
        item.append(link);
        list.append(item);
      });
      if (!receipts.length) {
        const empty = document.createElement('li');
        empty.textContent = 'No receipts attached yet.';
        list.append(empty);
      }
      return list;
    };

    const toFileArray = (value) => (value instanceof FileList ? Array.from(value) : value ? [value] : []);

    function UserTableView({ requests, currentStatus, pendingCount, approvedCount, rejectedCount, refresh }) {
      const tableRef = useRef(null);
      const filteredRequests = requests.filter(r => r.status === currentStatus);
      const tableKey = currentStatus + "_" + JSON.stringify(filteredRequests);

      useEffect(() => {
        if (!tableRef.current) return;
        
        const dt = $(tableRef.current).DataTable({
          dom: 'Bfrtip',
          buttons: [
            { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', className: 'btn btn-primary' },
            { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', className: 'btn btn-primary' },
            { extend: 'print', text: '<i class="fas fa-print"></i> Print', className: 'btn btn-primary' }
          ],
          pageLength: 10,
          order: [[0, 'desc']] // Sort by ID descending
        });

        return () => {
           dt.destroy();
        };
      }, [tableKey]);

      const manageReceipts = async (req) => {
        const receipts = await fetchReceipts(req.id);
        if (!receipts) return;
        const list = receiptListElement(receipts);

        const canAdd = req.status !== 'Rejected' && receipts.length < MAX_RECEIPTS;
        const result = await Swal.fire({
          title: `${req.reqId} Receipts`,
          html: list,
          ...(canAdd ? {
            input: 'file',
            inputAttributes: { multiple: 'multiple', accept: RECEIPT_ACCEPT, 'aria-label': 'Add receipts' },
            showCancelButton: true,
            confirmButtonText: 'Upload',
            inputValidator: (value) => {
              const chosen = toFileArray(value);
              if (!chosen.length) return 'Choose at least one receipt.';
              if (receipts.length + chosen.length > MAX_RECEIPTS) return `A request can have at most ${MAX_RECEIPTS} receipts.`;
              return checkReceiptFiles(chosen) || undefined;
            }
          } : { confirmButtonText: 'Close' })
        });
        if (!canAdd || !result.isConfirmed) return;

        const body = new FormData();
        body.append('request_id', req.id);
        toFileArray(result.value).forEach(file => body.append('receipts', file));
        try {
          const res = await fetch('/api/auth/add_receipts', { method: 'POST', body, credentials: 'include' });
          if (isSessionExpired(res)) return;
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'The receipts could not be uploaded.');
          refresh();
          Swal.fire({ icon: 'success', title: 'Receipts Added', timer: 1500, showConfirmButton: false });
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Upload Failed', text: err.message });
        }
      };

      const getStatusBadge = (status) => {
        if(status === 'Pending') return <span className="status-badge status-pending">Pending</span>;
        if(status === 'Approved') return <span className="status-badge status-approved">Approved</span>;
        if(status === 'Rejected') return <span className="status-badge status-rejected">Disapproved</span>;
      };

      return (
        <div>
          <div className="stats-grid-3">
            <div className="stat-card yellow is-inline">
              <div className="stat-icon"><i className="fas fa-clock"></i></div>
              <div className="stat-body">
                <div className="stat-value">{pendingCount}</div>
                <div className="stat-label">TOTAL PENDING</div>
              </div>
            </div>
            <div className="stat-card green is-inline">
              <div className="stat-icon"><i className="fas fa-check-circle"></i></div>
              <div className="stat-body">
                <div className="stat-value">{approvedCount}</div>
                <div className="stat-label">APPROVED</div>
              </div>
            </div>
            <div className="stat-card red is-inline">
              <div className="stat-icon"><i className="fas fa-times-circle"></i></div>
              <div className="stat-body">
                <div className="stat-value">{rejectedCount}</div>
                <div className="stat-label">DISAPPROVED</div>
              </div>
            </div>
          </div>

          <div className="table-card">
            <div className="filters-row is-heading">
              <h4><i className="fas fa-filter"></i> Filters</h4>
            </div>

            <div key={tableKey} className="table-scroll">
              <table ref={tableRef} className="display">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Employee</th>
                    <th>Department</th>
                    <th>Expense Type</th>
                    <th>Destination</th>
                    <th>Amount</th>
                    <th>Receipts</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredRequests.map(req => (
                    <tr key={req.id}>
                      <td><strong>{req.id}</strong></td>
                      <td>
                        <div className="cell-primary">{req.empName || req.email || 'Unknown'}</div>
                        <div className="cell-secondary">{req.empId || 'N/A'}</div>
                      </td>
                      <td>{req.department}</td>
                      <td>
                        <div>{req.reqType}</div>
                        {req.purpose && <div className="cell-secondary cell-purpose" title={req.purpose}>{req.purpose}</div>}
                      </td>
                      <td>
                        <div>{req.destination}</div>
                        {req.expenseDate && <div className="cell-secondary">{formatRequestDates(req.expenseDate, req.endDate)}</div>}
                      </td>
                      <td className="cell-nowrap">{req.amount} {req.currency}</td>
                      <td>
                        <button type="button" className="btn btn-secondary btn-sm" onClick={() => manageReceipts(req)} aria-label={`Receipts for ${req.reqId}`}>
                          <i className="fas fa-paperclip"></i> {req.receiptCount}
                        </button>
                      </td>
                      <td>{getStatusBadge(req.status)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const OTHER_OPTION = '__other__';

    function ChoiceField({ id, label, name, value, options, onChange }) {
      const [otherMode, setOtherMode] = useState(false);

      if (options.length === 0) {
        return (
          <div className="form-group">
            <label htmlFor={id}>{label}</label>
            <input id={id} type="text" value={value} onChange={e => onChange(name, e.target.value)} required />
          </div>
        );
      }

      return (
        <div className="form-group">
          <label htmlFor={id}>{label}</label>
          <select
            id={id}
            value={otherMode ? OTHER_OPTION : value}
            onChange={e => {
              const selected = e.target.value;
              setOtherMode(selected === OTHER_OPTION);
              onChange(name, selected === OTHER_OPTION ? '' : selected);
            }}
            required
          >
            <option value="" disabled>Select {label.toLowerCase()}</option>
            {options.map(option => <option key={option} value={option}>{option}</option>)}
            <option value={OTHER_OPTION}>Other (not listed)</option>
          </select>
          {otherMode && (
            <>
              <input
                className="field-other"
                type="text"
                value={value}
                onChange={e => onChange(name, e.target.value)}
                placeholder={`Type the ${label.toLowerCase()}`}
                aria-label={`${label} (not listed)`}
                required
                autoFocus
              />
              <small className="field-hint">New values go to manual review. Once an admin decides and the model is retrained, they are recognized automatically.</small>
            </>
          )}
        </div>
      );
    }

    function NewRequestForm({ user, setView, refresh }) {
      const [loading, setLoading] = useState(false);
      const [options, setOptions] = useState({});
      const [optionsLoaded, setOptionsLoaded] = useState(false);
      const [receiptFiles, setReceiptFiles] = useState([]);
      const [formData, setFormData] = useState({
        empName: user.email.split('@')[0],
        empId: '',
        role: '',
        department: '',
        reqType: '',
        destination: '',
        currency: 'INR',
        amount: 5000,
        purpose: '',
        expenseDate: localToday(),
        endDate: ''
      });

      useEffect(() => {
        fetch('/api/model/form_options', { credentials: 'include' })
          .then(res => (isSessionExpired(res) || !res.ok) ? null : res.json())
          .then(data => { if (data && data.options) setOptions(data.options); })
          .catch(() => {})
          .finally(() => setOptionsLoaded(true));

        fetch('/api/auth/get_profile', { credentials: 'include' })
          .then(res => res.ok ? res.json() : null)
          .then(profile => {
            if (profile) {
              setFormData(prev => ({ ...prev, empName: profile.name || prev.empName, empId: profile.emp_id || prev.empId }));
            }
          })
          .catch(() => {});
      }, []);

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
      const setField = (name, value) => setFormData(prev => ({ ...prev, [name]: value }));

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        const payload = {
          Role: formData.role, Department: formData.department,
          Request_Type: formData.reqType, Destination: formData.destination,
          Currency: formData.currency, Amount: parseFloat(formData.amount),
          Employee_Name: formData.empName, Employee_ID: formData.empId,
          Purpose: formData.purpose, Expense_Date: formData.expenseDate, End_Date: formData.endDate || null
        };
        const receiptProblem = checkReceiptFiles(receiptFiles);
        if (receiptProblem) {
          Swal.fire({ icon: 'error', title: 'Check Your Receipts', text: receiptProblem });
          setLoading(false);
          return;
        }
        // Sent as a form so receipt files travel with the request.
        const body = new FormData();
        Object.entries(payload).forEach(([key, value]) => { if (value !== null && value !== undefined) body.append(key, value); });
        receiptFiles.forEach(file => body.append('receipts', file));
        try {
          const response = await fetch('/api/predict', {
            method: 'POST',
            body,
            credentials: 'include'
          });
          if (isSessionExpired(response)) { setLoading(false); return; }
          const result = await response.json();
          if (response.ok) {
            if (result.status === "APPROVED") {
              // Auto-approved by AI
              Swal.fire({ icon: 'success', title: 'Auto-Approved!', text: 'Your request was approved instantly by the AI.' }).then(() => {
                  refresh();
                  setView('approved');
              });
            } else {
              // Escalated for review
              Swal.fire({ icon: 'warning', title: 'Sent for Manual Review', text: 'This request requires HR approval.' }).then(() => {
                  refresh();
                  setView('pending');
              });
            }
          } else {
            Swal.fire({ icon: 'error', title: 'API Error', text: result.error });
          }
        } catch (error) {
          Swal.fire({ icon: 'error', title: 'Connection Failed', text: 'Could not reach the server. Please try again.' });
        }
        setLoading(false);
      };

      return (
        <div>
          <div className="dash-banner">
            <div className="dash-banner-left">
              <div className="dash-banner-icon"><i className="fas fa-paper-plane"></i></div>
              <div>
                <h3>Submit Expense</h3>
                <p>Submit your expense and travel requests here. Our AI model scores them instantly.</p>
              </div>
            </div>
          </div>
          
          <div className="panel">
            <button type="button" className="btn btn-secondary btn-sm back-link" onClick={() => setView('pending')}>
              <i className="fas fa-arrow-left"></i> Back to Dashboard
            </button>
            <h3 className="panel-title"><i className="fas fa-edit"></i> Request Form</h3>
            {!optionsLoaded ? (
              <div className="loading-inline"><i className="fas fa-spinner fa-spin"></i> Loading request form...</div>
            ) : (
            <form onSubmit={handleSubmit}>
              <div className="form-grid">
                <div className="form-group">
                  <label htmlFor="nr-empName">Employee Name</label>
                  <input id="nr-empName" type="text" name="empName" value={formData.empName} onChange={handleChange} required />
                </div>
                <div className="form-group">
                  <label htmlFor="nr-empId">Employee ID</label>
                  <input id="nr-empId" type="text" name="empId" value={formData.empId} onChange={handleChange} required placeholder="e.g. EMP_1234" />
                </div>
                <ChoiceField id="nr-role" label="Job Role" name="role" value={formData.role} options={options.Role || []} onChange={setField} />
                <ChoiceField id="nr-department" label="Department" name="department" value={formData.department} options={options.Department || []} onChange={setField} />
                <ChoiceField id="nr-reqType" label="Expense Type" name="reqType" value={formData.reqType} options={options.Request_Type || []} onChange={setField} />
                <ChoiceField id="nr-destination" label="Destination" name="destination" value={formData.destination} options={options.Destination || []} onChange={setField} />
                <div className="form-group">
                  <label htmlFor="nr-currency">Currency</label>
                  <select id="nr-currency" name="currency" value={formData.currency} onChange={handleChange}>
                    <option value="INR">INR (₹)</option>
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="SGD">SGD (S$)</option>
                  </select>
                </div>
                <div className="form-group">
                  <label htmlFor="nr-amount">Amount</label>
                  <input id="nr-amount" type="number" name="amount" value={formData.amount} onChange={handleChange} required min="1" />
                </div>
                <div className="form-group">
                  <label htmlFor="nr-expenseDate">Expense date (or trip start)</label>
                  <input id="nr-expenseDate" type="date" name="expenseDate" value={formData.expenseDate} onChange={handleChange} required />
                </div>
                <div className="form-group">
                  <label htmlFor="nr-endDate">Trip end date (optional)</label>
                  <input id="nr-endDate" type="date" name="endDate" value={formData.endDate} min={formData.expenseDate || undefined} onChange={handleChange} />
                </div>
              </div>
              <div className="form-group">
                <label htmlFor="nr-purpose">Business purpose</label>
                <textarea id="nr-purpose" name="purpose" value={formData.purpose} onChange={handleChange} required minLength={10} maxLength={500} rows={3} placeholder="e.g. Client workshop at the Mumbai office" />
                <small className="field-hint">Explain why this expense is needed. Your approvers see this.</small>
              </div>
              <div className="form-group">
                <label htmlFor="nr-receipts">Receipts (optional)</label>
                <input id="nr-receipts" type="file" multiple accept={RECEIPT_ACCEPT} onChange={e => setReceiptFiles(Array.from(e.target.files))} />
                <small className="field-hint">PDF, JPG or PNG, up to 5 files of 5 MB each. Your company may require a receipt above a set amount.</small>
              </div>
              <button type="submit" className="btn btn-primary btn-block btn-lg" disabled={loading}>
                {loading ? <span><i className="fas fa-spinner fa-spin"></i> AI is analyzing...</span> : <span><i className="fas fa-robot"></i> Submit to AI Agent</span>}
              </button>
            </form>
            )}
          </div>
        </div>
      );
    }

    const TEAM_DECISIONS = {
      approve: { url: '/api/auth/approve_request', title: 'Approve this request?', inputLabel: 'Note (optional)', confirm: 'Approve', reasonRequired: false, done: 'Request Approved' },
      reject: { url: '/api/auth/reject_request', title: 'Reject this request?', inputLabel: 'Reason for rejecting (required)', confirm: 'Reject', reasonRequired: true, done: 'Request Rejected' }
    };

    const parseJsonList = (value) => {
      try {
        return value ? JSON.parse(value) : [];
      } catch (err) {
        return [];
      }
    };

    function TeamApprovalsView({ user }) {
      const [requests, setRequests] = useState(null);

      const load = async () => {
        try {
          const res = await fetch('/api/auth/team_requests', { credentials: 'include' });
          if (isSessionExpired(res)) return;
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Your team's requests could not be loaded.");
          setRequests(data.requests);
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Team Requests Unavailable', text: err.message });
          setRequests([]);
        }
      };

      useEffect(() => { load(); }, []);

      const decide = async (req, kind) => {
        const decision = TEAM_DECISIONS[kind];
        const answer = await Swal.fire({
          title: decision.title,
          input: 'textarea',
          inputLabel: decision.inputLabel,
          inputAttributes: { maxlength: '1000' },
          showCancelButton: true,
          confirmButtonText: decision.confirm,
          inputValidator: (value) => (decision.reasonRequired && !value.trim() ? 'Please give a reason. It is saved in the request history.' : undefined)
        });
        if (!answer.isConfirmed) return;

        try {
          const res = await fetch(decision.url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: req.id, comment: answer.value.trim() }),
            credentials: 'include'
          });
          if (isSessionExpired(res)) return;
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'The decision could not be saved.');
          await load();
          if (data.final_decision === 'ESCALATED_SECOND_APPROVAL') {
            Swal.fire({
              icon: 'info', title: 'First Approval Saved',
              text: 'This amount needs two approvals, so an administrator must approve it as well.'
            });
          } else {
            Swal.fire({ icon: 'success', title: decision.done, timer: 1500, showConfirmButton: false });
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Decision Failed', text: err.message });
        }
      };

      const viewReceipts = async (req, reqId) => {
        const receipts = await fetchReceipts(req.id);
        if (receipts) Swal.fire({ title: `${reqId} Receipts`, html: receiptListElement(receipts), confirmButtonText: 'Close' });
      };

      const isPending = (req) => req.final_decision.startsWith('ESCALATED');

      return (
        <div className="panel">
          <h3 className="panel-title"><i className="fas fa-user-tie"></i> Team Approvals</h3>
          <p className="panel-subtitle">Requests from people who report to you. You decide the ones waiting for you; rejecting needs a reason, and every decision is saved in the request history.</p>

          {requests === null ? (
            <div className="loading-inline"><i className="fas fa-spinner fa-spin"></i> Loading your team's requests...</div>
          ) : requests.length === 0 ? (
            <div className="empty-state is-neutral"><i className="fas fa-user-tie"></i>No requests from your team yet.</div>
          ) : (
            <div className="table-scroll">
              <table className="data-table">
                <thead>
                  <tr>
                    <th>Request</th>
                    <th>Employee</th>
                    <th>Details</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  {requests.map(req => {
                    const reqId = `REQ_${String(req.id).padStart(4, '0')}`;
                    const pending = isPending(req);
                    const waitingForMe = pending && req.approver_email === user.email;
                    return (
                      <tr key={req.id}>
                        <td className="cell-primary">{reqId}</td>
                        <td>
                          <div className="cell-primary">{req.employee_name || req.submitted_by}</div>
                          <div className="cell-secondary">{req.submitted_by}</div>
                        </td>
                        <td>
                          <div>{req.request_type} · {req.destination}</div>
                          {req.purpose && <div className="cell-secondary cell-purpose">{req.purpose}</div>}
                          {req.expense_date && <div className="cell-secondary">{formatRequestDates(req.expense_date, req.end_date)}</div>}
                          {parseJsonList(req.policy_violations).map(violation => (
                            <span key={violation.rule_id} className="badge badge-block badge-red" title={violation.reason}>
                              <i className="fas fa-scale-balanced"></i> {violation.name}
                            </span>
                          ))}
                        </td>
                        <td className="cell-nowrap">
                          <div>{req.amount} {req.currency}</div>
                          <button type="button" className="btn btn-secondary btn-sm" onClick={() => viewReceipts(req, reqId)} aria-label={`Receipts for ${reqId}`}>
                            <i className="fas fa-paperclip"></i> {req.receipt_count || 0}
                          </button>
                        </td>
                        <td>
                          <span className={`status-badge ${pending ? 'status-pending' : req.final_decision === 'APPROVED' ? 'status-approved' : 'status-rejected'}`}>
                            {pending ? 'Pending' : req.final_decision === 'APPROVED' ? 'Approved' : 'Rejected'}
                          </span>
                        </td>
                        <td className="cell-nowrap">
                          {waitingForMe ? (
                            <div className="cell-actions">
                              <button type="button" className="btn btn-primary btn-sm" onClick={() => decide(req, 'approve')}><i className="fas fa-check"></i> Approve</button>
                              <button type="button" className="btn btn-tinted-danger btn-sm" onClick={() => decide(req, 'reject')}><i className="fas fa-times"></i> Reject</button>
                            </div>
                          ) : (
                            <span className="cell-muted">
                              {!pending ? '—' : req.final_decision === 'ESCALATED_SECOND_APPROVAL' ? 'Waiting for a second approval' : 'With the admins'}
                            </span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function ProfileView({ user }) {
      const [loading, setLoading] = useState(false);
      const [profileData, setProfileData] = useState({ name: '', emp_id: '' });

      useEffect(() => {
        fetch('/api/auth/get_profile', { credentials: 'include' })
          .then(res => isSessionExpired(res) ? null : res.json())
          .then(data => {
            if(data && !data.error) {
              setProfileData({ name: data.name || '', emp_id: data.emp_id || '', manager_email: data.manager_email || '' });
            }
          });
      }, [user.email]);

      const handleChange = (e) => setProfileData({ ...profileData, [e.target.name]: e.target.value });

      const handleUpdate = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch('/api/auth/update_profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: user.email, name: profileData.name, emp_id: profileData.emp_id }),
            credentials: 'include'
          });
          if (isSessionExpired(res)) { setLoading(false); return; }
          const data = await res.json();
          if(res.ok) {
             Swal.fire({ title: 'Updated!', text: data.message, icon: 'success' });
          } else {
             Swal.fire({ title: 'Error', text: data.error, icon: 'error' });
          }
        } catch(err) {
          Swal.fire('Error', 'Connection failed', 'error');
        }
        setLoading(false);
      };

      const handleResetPassword = () => {
        Swal.fire({
          title: 'Reset Password',
          text: 'Are you sure want to Reset Your Password?',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Yes, reset it'
        }).then(async (result) => {
          if(result.isConfirmed) {
            Swal.fire({ title: 'Sending...', didOpen: () => { Swal.showLoading() } });
            try {
              const res = await fetch('/api/auth/request_password_reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email })
              });
              const data = await res.json();
              if (res.ok) {
                 Swal.fire('Notification Sent', 'A Notification Email is Sent to your Email to confirm, please check Your Inbox Or Spam Box', 'success')
                 .then(signOut);
              } else {
                 Swal.fire({ title: 'Error', text: data.error, icon: 'error' });
              }
            } catch(e) {
               Swal.fire('Error', 'Network error', 'error');
            }
          }
        });
      };

      return (
        <div className="panel">
          <h3 className="panel-title"><i className="fas fa-user-circle"></i> User Profile</h3>

          <div className="profile-hero">
            <div className="avatar-circle">{user.email.charAt(0).toUpperCase()}</div>
            <div>
              <div className="profile-hero-name">{profileData.name || user.email.split('@')[0]}</div>
              <div className="profile-hero-sub">{user.email}</div>
            </div>
          </div>

          <form onSubmit={handleUpdate} className="profile-form">
            <div className="form-group">
              <label htmlFor="pf-email">Email Address (Read Only)</label>
              <input id="pf-email" type="email" value={user.email} disabled />
            </div>
            <div className="form-group">
              <label htmlFor="pf-name">Full Name / Username</label>
              <input id="pf-name" type="text" name="name" value={profileData.name} onChange={handleChange} placeholder="e.g., John Doe" />
            </div>
            <div className="form-group">
              <label htmlFor="pf-empid">Employee ID</label>
              <input id="pf-empid" type="text" name="emp_id" value={profileData.emp_id} onChange={handleChange} placeholder="e.g., EMP_1234" />
            </div>
            <div className="form-group">
              <label htmlFor="pf-manager">Manager (set by your administrator)</label>
              <input id="pf-manager" type="text" value={profileData.manager_email || 'No manager assigned'} disabled />
            </div>
            <button type="submit" className="btn btn-primary" disabled={loading}>
               {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-save"></i>} Update Profile
            </button>
          </form>

          <hr className="divider" />

          <h4 className="panel-title is-danger"><i className="fas fa-shield-alt"></i> Security</h4>
          <p className="panel-subtitle">Need to update your password? Request a secure password reset link to your email.</p>
          <div className="button-row">
            <button type="button" onClick={handleResetPassword} className="btn btn-tinted-danger">
              <i className="fas fa-key"></i> Reset Password
            </button>
            <button type="button" onClick={() => {
                Swal.fire({
                  title: 'Are you sure?',
                  text: 'You will be logged out of your session',
                  icon: 'warning',
                  showCancelButton: true,
                  confirmButtonText: 'Yes, logout'
                }).then((result) => {
                  if(result.isConfirmed) {
                    signOut();
                  }
                });
            }} className="btn btn-secondary">
              <i className="fas fa-sign-out-alt"></i> Logout
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EmployeePortal />);
  </script>
</body>
</html>
